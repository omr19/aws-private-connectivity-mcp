[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws-private-connectivity-mcp"
version = "0.1.0"
description = "A small FastMCP lab for learning MCP through AWS private connectivity diagnostics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "mcp>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/privatepath_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
