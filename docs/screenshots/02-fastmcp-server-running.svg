<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560"><style>text{font-family:Arial;fill:#172033}.t{font-size:22px;font-weight:bold}.s{font-size:17px}</style><rect width="1200" height="560" fill="#fff"/><text x="40" y="45" class="t">FastMCP server running — public-safe evidence</text><rect x="40" y="80" width="1120" height="410" rx="12" fill="#111827"/><text x="75" y="130" class="s" fill="#fff">source .venv/bin/activate</text><text x="75" y="175" class="s" fill="#bfdbfe">export AWS_PROFILE=your-sandbox-profile</text><text x="75" y="215" class="s" fill="#bfdbfe">export AWS_REGION=eu-west-3</text><text x="75" y="255" class="s" fill="#bbf7d0">PYTHONPATH=src python -m privatepath_mcp.server</text><text x="75" y="315" class="s" fill="#bbf7d0">StreamableHTTP session manager started</text><text x="75" y="355" class="s" fill="#bbf7d0">Uvicorn running on http://127.0.0.1:8000</text><text x="75" y="415" class="s" fill="#fde68a">AWS account, role ARN, and credentials are redacted</text><text x="40" y="530" class="s">The endpoint and region demonstrate the reproducible local runtime without exposing identity metadata.</text></svg>
