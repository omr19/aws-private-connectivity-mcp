<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650"><style>text{font-family:Arial;fill:#172033}.t{font-size:22px;font-weight:bold}.h{font-size:18px;font-weight:bold}.s{font-size:16px}</style><rect width="1200" height="650" fill="#fff"/><text x="40" y="45" class="t">Project and environment — public-safe evidence</text><rect x="40" y="80" width="360" height="500" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="65" y="120" class="h">aws-private-connectivity-mcp</text><text x="75" y="165" class="s">client/</text><text x="75" y="200" class="s">docs/</text><text x="75" y="235" class="s">infrastructure/</text><text x="75" y="270" class="s">src/privatepath_mcp/</text><text x="75" y="305" class="s">README.md</text><text x="75" y="340" class="s">pyproject.toml</text><rect x="455" y="115" width="690" height="300" rx="12" fill="#111827"/><text x="485" y="160" class="s" fill="#fff">server.py — FastMCP tools</text><text x="485" y="215" class="s" fill="#bbf7d0">(.venv) project % python -m py_compile ...</text><text x="485" y="255" class="s" fill="#bbf7d0">(.venv) project % PYTHONPATH=src ...</text><text x="485" y="295" class="s" fill="#bfdbfe">AWS_PROFILE=your-sandbox-profile</text><text x="485" y="335" class="s" fill="#bfdbfe">AWS_REGION=eu-west-3</text><text x="485" y="375" class="s" fill="#fde68a">Credentials and account identifiers redacted</text><text x="455" y="485" class="h">Public version notes</text><text x="455" y="525" class="s">Repository paths and local usernames are removed.</text><text x="455" y="555" class="s">The original private capture is retained outside Git.</text></svg>
